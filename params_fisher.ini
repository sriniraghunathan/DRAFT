# Parameters for the delensing and Fisher forecasting stage, read by get_fisher_forecasts.load_fisher_params.
# Kept separate from params.ini, which configures the component separation and is stored verbatim inside every ILC product.
# Same flat "key = value" dialect: one entry per line, # starts a comment.

# Fiducial cosmology
# Names must be those class_generate_data recognizes; see delensing.CLASS_COSMO_KEYS.
# Fiducial values and step sizes follow Table 4 of the accompanying paper (arXiv:2608.XXXXX), after Allison et al. 2015 (arXiv:1509.07471).
# Every parameter CLASS should know about belongs here, including those held fixed. Yhe is deliberately
# absent so that CLASS sets the helium abundance to its BBN-consistent value given omega_b and N_eff.
fid_omega_b_h2 = 0.0222
fid_omega_c_h2 = 0.1197
fid_theta_s = 0.010409
fid_A_s = 2.196e-9
fid_n_s = 0.9655
fid_tau = 0.060
fid_N_eff = 3.044
fid_mnu = 0.06

# Step sizes for the two-sided numerical derivatives
# Only those of the varied parameters are used, the rest are ignored.
step_omega_b_h2 = 8.0e-4
step_omega_c_h2 = 3.0e-3
step_theta_s = 5.0e-5
step_A_s = 1.0e-10
step_n_s = 1.0e-2
step_tau = 2.0e-2
step_N_eff = 8.0e-2
step_mnu = 2.0e-2

# Parameters to vary, space separated
# Anything in the fiducial cosmology but not listed here is passed to CLASS and held fixed, which is
# how the neutrino mass is fixed at its fiducial value below.
vary_params = omega_b_h2 omega_c_h2 theta_s A_s n_s tau N_eff

# Multipole ranges for the Fisher sum
# The ground-based spectra start at lmin to avoid the largest scales, which are most affected by
# systematics and contribute negligibly; those scales are covered by the satellite block instead.
lmin = 30
lmax = 5000
lmax_TT = 5000
lmin_dd = 2
lmax_dd = 5000

# Buffer by which CLASS computes spectra beyond lmax, so the lensing convolution is accurate at lmax
# The ILC product must reach lmax + lbuffer.
lbuffer = 500

# Lowest multipole at which the ILC residual is used; the satellite noise alone is used below it
# Must exceed the multipole below which the residual vanishes, which is lmin in the ILC of params.ini.
lmin_ilc = 30

# Lensing reconstruction
# The temperature cut mitigates reconstruction biases from non-Gaussian foregrounds.
# delensing selects how many passes CLASS_delens makes: iterative re-reconstructs from
# iteratively delensing until the spectra converge, yes delenses once with the
# reconstruction obtained from the lensed spectra and no does not delens at all. The derivative
# runs always take a single pass since they are given a fixed reconstruction noise.
delensing = iterative
lmin_lensing = 2
lmax_T_lensing = 3000
lmax_P_lensing = 5000

# Satellite block
# Its noise is combined with the ILC residual above lmin_ilc and a separate Fisher block covering
# lmin_sat to lmax_sat in TT is added once to the total, at its own sky fraction.
sat_expname = planck
include_sat = 1
lmin_sat = 2
lmax_sat = 29
fsky_sat = 0.8

# Gaussian priors on individual parameters, as prior_<name> = sigma
# Applied once to the summed Fisher matrix. Remove the line to drop the prior.
prior_tau = 0.007

# Options
# Non-Gaussian lensing covariances are expensive and untested here; foreground bias is experimental.
do_non_gaussian = 0
do_foreground_bias = 0

# Foreground mismodeling, as fg_bias_<component> = <fraction>
# Read only when do_foreground_bias = 1, which is off by default: this option is experimental and
# should be treated as potentially unstable. A fraction of 1 means the component is not modeled at
# all, 0 that it is modeled perfectly, and a component not named here is taken as perfectly
# modeled. Values outside [0, 1] are allowed with a warning: above 1 means assuming less of a
# component than is present, below 0 over-subtracting it.
# The components available come from the fg_res_dic of the ILC product, so an ILC run without
# galactic foregrounds offers neither galdust nor galsync. The instrumental noise residual is
# also stored there but is not a foreground and cannot be given a fraction.
# Only multiplicative mismodeling is currently available for testing, so no changing the shape or
# the spectral energy distribution of a component.
# fg_bias_galdust = 0.2
# fg_bias_cib = 1.0

# Non-Gaussian derivative matrices
# Required when do_non_gaussian = 1 and ignored otherwise. Deliberately left unset: the three
# choices trade a large file against a long calculation and one should be picked on purpose.
#   recompute  run CLASS for the matrices each time and keep nothing
#   save       run CLASS and write the matrices into a DRAFT product for reuse
#   load       read the matrices back from an earlier run, with no CLASS run at all
# Each matrix is (lmax + lbuffer + 1) squared in float64, so a set is some 2.4 GB per derivative
# type for lmax = 5000; delensing.ng_derivative_bytes reports it for a given one.
# The lensed matrices do not depend on the noise and serve every configuration; the delensed ones
# do and are per configuration.
# ng_derivatives = recompute
